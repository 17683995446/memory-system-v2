name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        mkdir -p data logs
        python test_phase5_unit_tests.py
    
    - name: Run integration tests
      run: |
        python test_phase5_integration.py

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      if: github.event_name == 'release'
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name == 'release' }}
        tags: |
          agent-memory-system:latest
          agent-memory-system:${{ github.sha }}
          ${{ github.event_name == 'release' && format('agent-memory-system:{0}', github.ref_name) || '' }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Configure Kubernetes
      uses: azure/k8s-set-context@v4
      if: github.event_name == 'release'
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}
    
    - name: Deploy to Kubernetes
      if: github.event_name == 'release'
      run: |
        kubectl apply -f deploy/kubernetes.yaml
        kubectl rollout restart deployment/memory-system -n agent-memory-system

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [ test, deploy ]
    if: always()
    
    steps:
    - name: Send notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ needs.test.result }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
